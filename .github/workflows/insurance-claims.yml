name: Insurance claims tests
on:
  push:
    paths: ['insurance-claim-severity/**', '.github/workflows/insurance-claims.yml']
  pull_request:
    paths: ['insurance-claim-severity/**', '.github/workflows/insurance-claims.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insurance-claim-severity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
